name: Unzip
on: workflow_dispatch

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and replace files
        run: |
          set -e

          ZIP=$(ls ./*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No zip file found in repo root"
            exit 1
          fi
          echo "Found: $ZIP"

          mkdir -p /tmp/extract
          unzip -q "$ZIP" -d /tmp/extract

          CONFIG=$(find /tmp/extract -maxdepth 3 -name config.js | head -n 1)
          if [ -z "$CONFIG" ]; then
            echo "config.js not found inside the zip"
            exit 1
          fi
          SRC=$(dirname "$CONFIG")
          echo "Source folder: $SRC"

          # مسح الملفات القديمة (كيبقى .git و .github)
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          cp -a "$SRC"/. .
          rm -f .env

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Ayato BOT files"
            git push
          fi
