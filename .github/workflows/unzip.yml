name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q Ayato-BOT.zip
          cp -a Pomni-AI-main/. .
          rm -rf Ayato-BOT Ayato-BOT.zip .env
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add Ayato bot files"
          git push
